name: Build and Upload Debian Package

on:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          python3-all \
          meson \
          ninja-build \
          python3-pytest \
          libglib2.0-dev \
          python3-all \
          debhelper \
          dh-python \
          build-essential \
          desktop-file-utils \
          gtk-update-icon-cache \
          python3-gi \
          gir1.2-gtk-4.0 \
          python3-gi-cairo

    - name: Clone Blueprint-compiler (The one in APT is too outdated to be used for the app)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@users.noreply.github.com"
        git clone https://gitlab.gnome.org/GNOME/blueprint-compiler
        cd blueprint-compiler/
        meson setup build
        ninja -C build
        sudo ninja -C build install
        hash -r

    - name: Build .deb package
      run: |
        dpkg-buildpackage -us -uc -b
      env:
        DEB_BUILD_OPTIONS: nocheck

    - name: List built files (debug)
      run: ls -l ../

    - name: Move .deb into workspace
      run: mv ../chatenium-ol-adwaita_*_all.deb ./builded.deb

    - name: Upload .deb to Release
      uses: svenstaro/upload-release-action@v2
      with:
        file: builded.deb
        overwrite: true
        tag: ${{ github.ref }}
        asset_name: chtn-ol-adwaita-$tag-all.deb
        repo_token: ${{ secrets.REPO_TOKEN }}

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-artifact
        path: builded.deb
        
  update-repo:
    runs-on: ubuntu-latest
    needs: build-deb
    steps:
      - name: Install reprepro & git
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro git gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-keys

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-artifact
          path: ./artifact

      - name: Clone GitHub Pages repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone https://github.com/chatenium/chatenium.github.io.git repo

      - name: Add .deb to reprepro
        run: |
          cd repo
          mkdir -p pool
          reprepro -b ./apt includedeb bookworm pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb
          reprepro -b ./apt includedeb trixie pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb

      - name: Commit & push changes
        run: |
          cd repo
          git add .
          git commit -m "Add new release ${{ github.ref }}"
          git push https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/chatenium/chatenium.github.io.git main
