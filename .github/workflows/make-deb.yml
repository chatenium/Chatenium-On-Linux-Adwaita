name: Build and Upload Debian Package

on:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: debian:sid
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y \
          meson \
          ninja-build \
          python3-pytest \
          blueprint-compiler \
          libglib2.0-dev \
          python3-all \
          debhelper \
          dh-python \
          blueprint-compiler \
          desktop-file-utils \
          libgtk-4-bin \
          libgtk-3-bin \
          libgtk-4-dev \
          libadwaita-1-dev \
          gobject-introspection \
          gir1.2-gtk-4.0 \
          gir1.2-adw-1

    - name: Build .deb
      run: |
        dpkg-buildpackage -us -uc -b

    - name: List built files (debug)
      run: ls -l ../

    - name: Move .deb into workspace
      run: mv ../chatenium-ol-adwaita_*_all.deb ./builded.deb

    - name: Upload .deb to Release
      uses: svenstaro/upload-release-action@v2
      with:
        file: builded.deb
        overwrite: true
        tag: ${{ github.ref }}
        asset_name: chtn-ol-adwaita-$tag-all.deb
        repo_token: ${{ secrets.REPO_TOKEN }}

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-artifact
        path: builded.deb
        
  update-repo:
    runs-on: ubuntu-latest
    needs: build-deb
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Install reprepro & git
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro git gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-keys

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-artifact
          path: ./artifact

      - name: Clone GitHub Pages repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone https://github.com/chatenium/chatenium.github.io.git repo

      - name: Add .deb to reprepro
        run: |
          cd repo
          mkdir -p pool
          cp ../artifact/builded.deb pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb
          reprepro -b ./apt includedeb bookworm pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb
          reprepro -b ./apt includedeb trixie pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb
          rm pool/chatenium-ol-adw_${RELEASE_TAG}_all.deb

      - name: Commit & push changes
        run: |
          cd repo
          git add .
          git commit -m "Add new release ${{ github.ref }}"
          git push https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/chatenium/chatenium.github.io.git main
